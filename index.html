<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>老婆万岁</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/locale/zh-cn.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", Helvetica, Arial, sans-serif; 
            background-color: #F2F2F7; color: #1c1c1e; padding-bottom: 90px;
            -webkit-tap-highlight-color: transparent;
        }
        .shadow-apple { box-shadow: 0 4px 20px rgba(0,0,0,0.05), 0 1px 4px rgba(0,0,0,0.03); }
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 14px; }
        .spinner { border: 2px solid rgba(255,255,255,0.3); border-top: 2px solid white; border-radius: 50%; width: 20px; height: 20px; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* 状态点样式 */
        .dot-status { width: 10px; height: 10px; border-radius: 50%; }
        .dot-green { background-color: #34C759; box-shadow: 0 0 4px rgba(52, 199, 89, 0.4); }
        .dot-red { background-color: #FF3B30; opacity: 0.3; }
        .dot-future { background-color: #E5E5EA; }
    </style>
    <script>dayjs.locale('zh-cn');</script>
</head>
<body class="p-4 max-w-sm mx-auto">

    <div class="mt-4 mb-4 flex justify-between items-center px-1">
        <div>
            <p class="text-xs text-gray-400 font-bold uppercase tracking-wider mb-0.5" id="todayDate">LOADING...</p>
            <h1 class="text-2xl font-extrabold text-gray-900">摘要</h1>
        </div>
        <button onclick="openSettings()" class="bg-white p-2 rounded-full shadow-sm active:scale-95 transition">
            <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        </button>
    </div>

    <div id="medCard" class="card shadow-apple bg-gradient-to-br from-blue-500 to-indigo-600 text-white relative overflow-hidden transition-all duration-500">
        <div id="loadingOverlay" class="absolute inset-0 bg-black/20 backdrop-blur-sm flex items-center justify-center z-20 hidden"><div class="spinner"></div></div>
        
        <div class="flex justify-between items-start mb-4">
            <div>
                <h2 class="text-base font-bold">每日服药 (每次2粒)</h2>
                <p class="text-xs opacity-80">坚持规律服药是治疗关键</p>
            </div>
            <div class="flex items-center bg-black/10 rounded-lg px-2 py-1 gap-2">
                <span class="text-xs font-bold">💧 <span id="waterCount">0</span>/<span id="waterTarget">8</span></span>
                <button onclick="updateWater(1)" class="w-5 h-5 bg-white/20 rounded text-xs flex items-center justify-center hover:bg-white/30">+</button>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <button onclick="checkIn('am')" id="btnAm" class="group relative flex flex-col items-center justify-center py-4 rounded-xl border border-white/20 bg-white/10 active:scale-95 transition-all">
                <div id="iconAm" class="text-2xl mb-1 opacity-50">☀️</div>
                <span id="textAm" class="text-sm font-bold opacity-80">早晨服药</span>
                <span id="timeAm" class="text-[10px] opacity-60 mt-1 h-3">--:--</span>
                <div id="checkAm" class="absolute inset-0 bg-white/90 rounded-xl hidden flex-col items-center justify-center text-green-600 transition-opacity">
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
                    <span class="text-xs font-bold mt-1">早晨已服</span>
                </div>
            </button>

            <button onclick="checkIn('pm')" id="btnPm" class="group relative flex flex-col items-center justify-center py-4 rounded-xl border border-white/20 bg-white/10 active:scale-95 transition-all">
                <div id="iconPm" class="text-2xl mb-1 opacity-50">🌙</div>
                <span id="textPm" class="text-sm font-bold opacity-80">晚间服药</span>
                <span id="timePm" class="text-[10px] opacity-60 mt-1 h-3">--:--</span>
                <div id="checkPm" class="absolute inset-0 bg-white/90 rounded-xl hidden flex-col items-center justify-center text-indigo-600 transition-opacity">
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
                    <span class="text-xs font-bold mt-1">晚间已服</span>
                </div>
            </button>
        </div>
    </div>

    <div class="grid grid-cols-2 gap-3 mb-3">
        <div class="card shadow-apple mb-0 p-4 flex flex-col justify-between">
            <span class="text-xs font-bold text-gray-400 uppercase">当前库存</span>
            <div class="flex items-end gap-1 my-1">
                <span class="text-3xl font-extrabold text-gray-900" id="stockCount">--</span>
                <span class="text-xs text-gray-500 mb-1 font-bold">粒</span>
            </div>
            <div class="w-full bg-gray-100 rounded-full h-1.5"><div id="stockBar" class="bg-blue-500 h-1.5 rounded-full" style="width: 50%"></div></div>
        </div>
        <div class="card shadow-apple mb-0 p-4 flex flex-col justify-between">
            <span class="text-xs font-bold text-gray-400 uppercase">距离复查</span>
            <div class="flex items-end gap-1 my-1">
                <span class="text-3xl font-extrabold text-gray-900" id="daysUntil">--</span>
                <span class="text-xs text-gray-500 mb-1 font-bold">天</span>
            </div>
            <p class="text-[10px] text-gray-400" id="visitDate">目标: --/--</p>
        </div>
    </div>

    <div class="card shadow-apple p-4 mb-3">
        <div class="flex justify-between items-center mb-3">
            <h3 class="text-sm font-bold text-gray-800">近 7 天服药概况</h3>
            <button onclick="showHistoryModal()" class="text-xs text-blue-600 font-bold bg-blue-50 px-2 py-1 rounded-md">查看更多</button>
        </div>
        <div class="flex justify-between" id="weekHistory">
            </div>
        <div class="flex justify-end gap-3 mt-2 text-[10px] text-gray-400">
            <span class="flex items-center gap-1"><div class="w-2 h-2 rounded-full bg-[#34C759]"></div>已服</span>
            <span class="flex items-center gap-1"><div class="w-2 h-2 rounded-full bg-[#FF3B30] opacity-30"></div>未服</span>
        </div>
    </div>

    <div class="card shadow-apple p-4 mb-3 bg-amber-50/50 border border-amber-100/50">
        <div class="flex gap-2">
            <div class="mt-0.5 text-amber-500">💡</div>
            <div class="text-xs text-gray-600 leading-relaxed">
                <span class="font-bold text-gray-800">医嘱备忘：</span>
                每日早晚各一次，每次 2 粒。服药前后 2 小时禁食。
            </div>
        </div>
    </div>

    <div class="card shadow-apple p-4 mb-6">
        <div class="flex justify-between items-center mb-2">
            <h3 class="text-sm font-bold text-gray-800">BCR-ABL (IS%)</h3>
            <span class="text-[10px] bg-gray-100 px-1 rounded text-gray-500">对数轴</span>
        </div>
        <div style="height: 180px;"><canvas id="chartBcr"></canvas></div>
    </div>

    <button onclick="openEntryModal()" class="w-full bg-blue-600 text-white py-3.5 rounded-xl text-base font-bold shadow-lg shadow-blue-500/30 active:scale-95 transition flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
        <span>录入化验单 / 更新库存</span>
    </button>

    <div id="entryModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden z-50 flex items-end sm:items-center justify-center transition-opacity">
        <div class="bg-white w-full sm:max-w-sm rounded-t-2xl sm:rounded-2xl p-6 shadow-2xl animate-slide-up">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold">更新数据</h2>
                <button onclick="closeEntryModal()" class="text-gray-400 p-1">✕</button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">本次化验日期</label>
                    <input type="date" id="inDate" class="w-full bg-gray-100 rounded-lg p-3 text-sm font-bold outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">白细胞 (WBC)</label>
                        <input type="number" id="inWbc" placeholder="选填" class="w-full bg-gray-100 rounded-lg p-3 text-sm font-bold outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">BCR-ABL %</label>
                        <input type="number" id="inBcr" placeholder="选填" class="w-full bg-gray-100 rounded-lg p-3 text-sm font-bold outline-none">
                    </div>
                </div>
                
                <div class="border-t border-gray-100 my-2 pt-2">
                    <p class="text-xs text-blue-500 font-bold mb-3">配置更新 (可选)</p>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">修正剩余库存</label>
                            <input type="number" id="inStock" class="w-full bg-blue-50 text-blue-800 rounded-lg p-3 text-sm font-bold outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 mb-1">下次复查日期</label>
                            <input type="date" id="inNextVisit" class="w-full bg-blue-50 text-blue-800 rounded-lg p-3 text-sm font-bold outline-none">
                        </div>
                    </div>
                </div>
            </div>

            <button onclick="saveEntryData()" class="w-full mt-6 bg-blue-600 text-white py-3 rounded-xl font-bold text-sm shadow-lg shadow-blue-500/30">保存所有更改</button>
        </div>
    </div>

    <div id="historyModal" class="fixed inset-0 bg-white z-50 hidden overflow-y-auto">
        <div class="p-4 max-w-sm mx-auto">
            <div class="flex justify-between items-center mb-6 mt-2">
                <h2 class="text-xl font-bold">服药历史 (近60天)</h2>
                <button onclick="document.getElementById('historyModal').classList.add('hidden')" class="bg-gray-100 p-2 rounded-full text-sm font-bold text-gray-600">关闭</button>
            </div>
            <div id="historyList" class="space-y-2">
                </div>
        </div>
    </div>

    <div id="settingsModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-6">
        <div class="bg-white w-full rounded-2xl p-6 shadow-2xl">
            <h2 class="text-lg font-bold mb-4">Github 设置</h2>
            <div class="space-y-3">
                <input type="text" id="cfgUser" class="w-full bg-gray-100 rounded-lg p-3 text-sm" placeholder="Username">
                <input type="text" id="cfgRepo" class="w-full bg-gray-100 rounded-lg p-3 text-sm" placeholder="Repo Name">
                <input type="password" id="cfgToken" class="w-full bg-gray-100 rounded-lg p-3 text-sm" placeholder="Token">
            </div>
            <button onclick="saveSettings()" class="w-full mt-4 bg-blue-600 text-white py-3 rounded-xl font-bold text-sm">保存连接</button>
            <button onclick="document.getElementById('settingsModal').classList.add('hidden')" class="w-full mt-2 text-gray-400 text-sm py-2">取消</button>
        </div>
    </div>

    <div id="errorBox" class="hidden fixed top-4 left-4 right-4 bg-red-500 text-white p-3 rounded-lg shadow-lg z-[60] text-sm font-bold text-center"></div>

    <script>
        const CACHE_KEY = 'cml_config_v5'; 
        let config = JSON.parse(localStorage.getItem(CACHE_KEY));
        let appData = { tixing: null, chiyao: [], tijian: [] };
        let shas = {};

        async function init() {
            document.getElementById('todayDate').innerText = dayjs().format('MM月DD日 dddd');
            if (!config) { openSettings(); return; }
            
            setLoading(true);
            try {
                await Promise.all([
                    loadFile('tixing.json', 'tixing'),
                    loadFile('chiyao.json', 'chiyao'),
                    loadFile('tijian.json', 'tijian')
                ]);
                renderUI();
            } catch (err) {
                showError(err.message);
            }
            setLoading(false);
        }

        // --- 网络层 ---
        async function loadFile(filename, key) {
            const res = await fetch(`https://api.github.com/repos/${config.user}/${config.repo}/contents/${filename}`, {
                headers: { 'Authorization': `token ${config.token}`, 'Accept': 'application/vnd.github.v3+json' }, cache: "no-store"
            });
            if (!res.ok) throw new Error(`无法加载 ${filename}`);
            const json = await res.json();
            shas[filename] = json.sha;
            appData[key] = JSON.parse(decodeURIComponent(escape(window.atob(json.content))));
        }

        async function saveFile(filename, contentObj) {
            const contentBase64 = window.btoa(unescape(encodeURIComponent(JSON.stringify(contentObj, null, 2))));
            const res = await fetch(`https://api.github.com/repos/${config.user}/${config.repo}/contents/${filename}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${config.token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `Update ${filename}`, content: contentBase64, sha: shas[filename] })
            });
            if (!res.ok) throw new Error("保存失败");
            const json = await res.json();
            shas[filename] = json.content.sha;
        }

        // --- 核心逻辑 ---
        async function checkIn(type) {
            // type: 'am' or 'pm'
            setLoading(true);
            try {
                const today = dayjs().format('YYYY-MM-DD');
                if (!Array.isArray(appData.chiyao)) appData.chiyao = [];
                
                let log = appData.chiyao.find(l => l.date === today);
                if (!log) {
                    log = { date: today, taken_am: false, time_am: "", taken_pm: false, time_pm: "", water_count: 0 };
                    appData.chiyao.push(log);
                }

                // 防止重复点击
                if ((type === 'am' && log.taken_am) || (type === 'pm' && log.taken_pm)) {
                    setLoading(false); return;
                }

                // 标记状态
                if (type === 'am') { log.taken_am = true; log.time_am = dayjs().format('HH:mm'); }
                if (type === 'pm') { log.taken_pm = true; log.time_pm = dayjs().format('HH:mm'); }

                // 扣库存 (根据 single_dose，如果没设置默认扣2粒)
                const dose = appData.tixing.single_dose || 2; 
                appData.tixing.total_pills = Math.max(0, appData.tixing.total_pills - dose);

                await Promise.all([saveFile('chiyao.json', appData.chiyao), saveFile('tixing.json', appData.tixing)]);
                renderUI();
            } catch (e) { showError(e.message); }
            setLoading(false);
        }

        async function updateWater(delta) {
            const today = dayjs().format('YYYY-MM-DD');
            let log = appData.chiyao.find(l => l.date === today);
            if (!log) { log = { date: today, taken_am: false, taken_pm: false, water_count: 0 }; appData.chiyao.push(log); }
            log.water_count = (log.water_count || 0) + delta;
            document.getElementById('waterCount').innerText = log.water_count;
            try { await saveFile('chiyao.json', appData.chiyao); } catch(e){}
        }

        // --- 渲染 UI ---
        function renderUI() {
            const today = dayjs().format('YYYY-MM-DD');
            const log = appData.chiyao.find(l => l.date === today) || {};

            // 1. 药卡状态
            const updateBtn = (type, taken, time) => {
                const capType = type.charAt(0).toUpperCase() + type.slice(1);
                const checkEl = document.getElementById(`check${capType}`);
                const timeEl = document.getElementById(`time${capType}`);
                
                if (taken) {
                    checkEl.classList.remove('hidden');
                    checkEl.classList.add('flex');
                    timeEl.innerText = time;
                } else {
                    checkEl.classList.add('hidden');
                    checkEl.classList.remove('flex');
                    timeEl.innerText = "";
                }
            };
            updateBtn('am', log.taken_am, log.time_am);
            updateBtn('pm', log.taken_pm, log.time_pm);

            // 药卡背景渐变：全完成(绿) -> 部分完成(蓝)
            const card = document.getElementById('medCard');
            if (log.taken_am && log.taken_pm) {
                card.className = "card shadow-apple bg-gradient-to-br from-emerald-500 to-green-500 text-white relative overflow-hidden transition-all duration-500";
            } else {
                card.className = "card shadow-apple bg-gradient-to-br from-blue-500 to-indigo-600 text-white relative overflow-hidden transition-all duration-500";
            }

            // 2. 饮水与库存
            document.getElementById('waterCount').innerText = log.water_count || 0;
            document.getElementById('waterTarget').innerText = appData.tixing.water_target || 8;
            
            const stock = appData.tixing.total_pills;
            document.getElementById('stockCount').innerText = stock;
            const pct = Math.min(100, (stock / 120) * 100);
            document.getElementById('stockBar').style.width = `${pct}%`;
            document.getElementById('stockBar').className = `h-1.5 rounded-full ${stock<14?'bg-red-500':'bg-white/50'}`; // 库存条颜色

            const daysLeft = dayjs(appData.tixing.next_visit_date).diff(dayjs(), 'day');
            document.getElementById('daysUntil').innerText = daysLeft > 0 ? daysLeft : 0;
            document.getElementById('visitDate').innerText = `目标: ${dayjs(appData.tixing.next_visit_date).format('MM/DD')}`;

            // 3. 历史小卡片 (近7天)
            renderWeekHistory();
            renderCharts();
        }

        function renderWeekHistory() {
            const container = document.getElementById('weekHistory');
            container.innerHTML = '';
            // 生成过去6天 + 今天
            for (let i = 6; i >= 0; i--) {
                const d = dayjs().subtract(i, 'day');
                const dStr = d.format('YYYY-MM-DD');
                const log = appData.chiyao.find(l => l.date === dStr);
                const isFuture = d.isAfter(dayjs(), 'day');

                // 状态逻辑：红(漏服), 绿(已服), 灰(未来/今日未到时间暂不标红? 简化起见，未服即红，未来灰)
                // 这里做个优化：如果是“今天”，还没打卡，显示灰色空心或者特定样式，别直接给红的压力太大。
                // 简化版：早/晚两个点
                
                const getDotClass = (taken) => taken ? 'dot-green' : (dStr === dayjs().format('YYYY-MM-DD') ? 'dot-future border border-gray-300' : 'dot-red');

                const amClass = getDotClass(log?.taken_am);
                const pmClass = getDotClass(log?.taken_pm);

                const col = document.createElement('div');
                col.className = 'flex flex-col items-center gap-1.5';
                col.innerHTML = `
                    <span class="text-[10px] text-gray-400 font-bold">${d.format('DD')}</span>
                    <div class="dot-status ${amClass}"></div>
                    <div class="dot-status ${pmClass}"></div>
                `;
                container.appendChild(col);
            }
        }

        function renderHistoryModal() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            // 生成60天
            const logsMap = {};
            appData.chiyao.forEach(l => logsMap[l.date] = l);

            for (let i = 0; i < 60; i++) {
                const d = dayjs().subtract(i, 'day');
                const dStr = d.format('YYYY-MM-DD');
                const log = logsMap[dStr];
                
                const amStatus = log?.taken_am ? '<span class="text-green-500 font-bold">早 ✔</span>' : '<span class="text-red-400 opacity-50">早 ✕</span>';
                const pmStatus = log?.taken_pm ? '<span class="text-green-500 font-bold">晚 ✔</span>' : '<span class="text-red-400 opacity-50">晚 ✕</span>';

                const row = document.createElement('div');
                row.className = "flex justify-between items-center bg-gray-50 p-3 rounded-xl border border-gray-100";
                row.innerHTML = `
                    <span class="font-bold text-gray-700">${d.format('MM月DD日')}</span>
                    <div class="text-sm flex gap-4">${amStatus} ${pmStatus}</div>
                `;
                list.appendChild(row);
            }
        }

        function renderCharts() {
            const ctx = document.getElementById('chartBcr').getContext('2d');
            const data = [...appData.tijian].sort((a,b)=>dayjs(a.date).diff(dayjs(b.date)));
            
            // 简单图表，仅BCR
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d=>dayjs(d.date).format('MM/DD')),
                    datasets: [{
                        label: 'BCR-ABL', data: data.map(d=>d.bcr_abl),
                        borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.1)', fill:true, tension:0.3
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: { y: { type: 'logarithmic', grid:{borderDash:[4,4]} }, x:{grid:{display:false}} },
                    plugins: { legend: {display:false} }
                }
            });
        }

        // --- 全能录入功能 ---
        function openEntryModal() {
            document.getElementById('entryModal').classList.remove('hidden');
            // 填充默认值
            document.getElementById('inDate').value = dayjs().format('YYYY-MM-DD');
            document.getElementById('inStock').value = appData.tixing.total_pills;
            document.getElementById('inNextVisit').value = appData.tixing.next_visit_date;
        }
        function closeEntryModal() { document.getElementById('entryModal').classList.add('hidden'); }
        
        async function saveEntryData() {
            setLoading(true);
            try {
                // 1. 保存化验单 (如果有填)
                const date = document.getElementById('inDate').value;
                const wbc = document.getElementById('inWbc').value;
                const bcr = document.getElementById('inBcr').value;
                
                if (wbc || bcr) {
                    const entry = { date: date, wbc: wbc?parseFloat(wbc):null, bcr_abl: bcr?parseFloat(bcr):null };
                    appData.tijian.push(entry);
                }

                // 2. 更新配置
                const stock = parseInt(document.getElementById('inStock').value);
                const nextVisit = document.getElementById('inNextVisit').value;
                
                if (!isNaN(stock)) appData.tixing.total_pills = stock;
                if (nextVisit) appData.tixing.next_visit_date = nextVisit;

                // 3. 批量上传
                await Promise.all([
                    saveFile('tijian.json', appData.tijian),
                    saveFile('tixing.json', appData.tixing)
                ]);
                
                closeEntryModal();
                renderUI();
                showError("数据已更新 ✨"); // 其实是Success Message，借用ErrorBox显示
                document.getElementById('errorBox').classList.remove('bg-red-500');
                document.getElementById('errorBox').classList.add('bg-green-500');
                setTimeout(() => {
                    document.getElementById('errorBox').classList.add('hidden');
                    document.getElementById('errorBox').classList.remove('bg-green-500');
                    document.getElementById('errorBox').classList.add('bg-red-500');
                }, 2000);

            } catch (e) { showError(e.message); }
            setLoading(false);
        }

        // --- 辅助功能 ---
        function showHistoryModal() { renderHistoryModal(); document.getElementById('historyModal').classList.remove('hidden'); }
        function openSettings() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function saveSettings() {
            const u=document.getElementById('cfgUser').value, r=document.getElementById('cfgRepo').value, t=document.getElementById('cfgToken').value;
            if(u&&r&&t) { localStorage.setItem(CACHE_KEY, JSON.stringify({user:u, repo:r, token:t})); location.reload(); }
        }
        function showError(msg) { const b=document.getElementById('errorBox'); b.innerText=msg; b.classList.remove('hidden'); setTimeout(()=>b.classList.add('hidden'), 3000); }
        function setLoading(b) { document.getElementById('loadingOverlay').classList[b?'remove':'add']('hidden'); }
        if(config) { document.getElementById('cfgUser').value=config.user; document.getElementById('cfgRepo').value=config.repo; document.getElementById('cfgToken').value=config.token; }

        init();
    </script>
</body>
</html>
